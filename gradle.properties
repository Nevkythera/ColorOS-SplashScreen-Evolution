org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# libxposed service 102 需要 compileSdk 37，但离线环境只装了 android-36，
# 且 AGP 8.13 官方支持上限也是 36（升级 AGP 会连带要求 37）。
#
# 实际影响：102 的 AAR 仅为元数据声明（minCompileSdk=37），其字节码并未使用
# API 37 的任何符号——XposedService / HotReloadResult 依赖的只是 framework
# 里早已存在的 Bundle / ParcelFileDescriptor / SharedPreferences。
# 因此关闭 AGP 的 AAR 元数据 compileSdk 校验是安全的，仍用 compileSdk 36 编译。
#
# 两个开关的区别：
#   android.experimental.disableCompileSdkChecks —— 关闭 AAR 元数据里的
#       minCompileSdk 与 compileSdk 的比对（本例所需）
#   android.suppressUnsupportedCompileSdk      —— 关闭 AGP 自身对
#       "compileSdk 超过推荐上限" 的告警（本例 compileSdk 未超，仅备查）
android.experimental.disableCompileSdkChecks=true

# ---------------------------------------------------------------------------
# arm64 沙箱：AGP 默认从 Maven 拉取的 aapt2 是 x86_64 二进制，在 aarch64 上无法
# 执行（Daemon startup failed）。这里指向 SDK build-tools 里的 aapt2 包装脚本
# （qemu-x86_64-static 透明转发到 aapt2.x86_64）。
android.aapt2FromMavenOverride=/root/android-sdk/build-tools/36.0.0/aapt2
